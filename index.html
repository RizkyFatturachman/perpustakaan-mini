<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Mini</title>
</head>
<body>
  <h1>Sistem Perpustakaan Mini</h1>
  <p>Aplikasi sederhana untuk mengelola peminjaman buku.</p>

  <h2>Menu Utama</h2>
  <ul>
    <li>Katalog Buku</li>
    <li>Peminjaman Buku</li>
    <li>Riwayat Peminjaman</li>
  </ul>
  <h2>Formulir Peminjaman Buku</h2>
  <form>
    <label>Nama Anggota</label><br>
    <input type="text" placeholder="Masukkan nama lengkap">
    <br><br>

    <label>Judul Buku</label><br>
    <select>
      <option>Pemrograman Web Dasar</option>
      <option>Basis Data untuk Pemula</option>
      <option>Rekayasa Perangkat Lunak</option>
    </select>
    <br><br>

    <label>Tanggal Pinjam</label><br>
    <input type="date">
    <br><br>

    <button type="button">Pinjam Buku</button>
  </form>
</body>
</html>
