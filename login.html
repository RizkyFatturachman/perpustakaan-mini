<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Peminjaman Ruang Kampus</title>
</head>
<body>
  <h1>Login</h1>
  <p>Silakan masuk untuk menggunakan Sistem Peminjaman Ruang Kampus.</p>

  <h2>Menu</h2>
  <ul>
    <li><a href="index.html">Beranda</a></li>
    <li>Login</li>
  </ul>

  <h2>Form Login</h2>
  <form>
    <label>NPM / Username</label>
    <input type="text" placeholder="Masukkan NPM atau username">

    <br><br>

    <label>Password</label>
    <input type="password" placeholder="Masukkan password">

    <br><br>

    <label>Masuk sebagai</label>
    <select>
      <option>Mahasiswa</option>
      <option>Dosen</option>
      <option>Admin</option>
    </select>

    <br><br>

    <button type="button">Masuk</button>
  </form>
</body>
</html>
